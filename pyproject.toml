[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "donkeycar"
dynamic = ["version"]
authors = [
    {name = "Will Roscoe"},
    {name = "Adam Conway"},
    {name = "Tawn Kramer"},
]
description = "Self driving library for python."
readme = "README.md"
license = {text = "MIT"}
keywords = ["selfdriving", "cars", "donkeycar", "diyrobocars"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12.0,<3.14"
dependencies = [
    "numpy>=1.26.0",
    "pillow",
    "docopt-ng",
    "tornado",
    "requests",
    "PrettyTable",
    "paho-mqtt",
    "simple_pid",
    "progress",
    "pyfiglet",
    "psutil",
    "pynmea2",
    "pyserial",
    "utm",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
pi = [
    "Adafruit_PCA9685",
    "adafruit-circuitpython-ssd1306",
    "adafruit-circuitpython-rplidar",
    "adafruit-circuitpython-mpu6050",
    "adafruit-circuitpython-bno055",
    "gpiozero",
    "ai-edge-litert>=2.1.4",
    "opencv-contrib-python",
    "matplotlib",
    "kivy",
    "kivy-garden.matplotlib",
    "pandas",
    "pandas-stubs",
    "plotly",
    "albumentations",
]
nano = [
    "Adafruit_PCA9685",
    "adafruit-circuitpython-ssd1306",
    "adafruit-circuitpython-rplidar",
    "Jetson.GPIO",
    "numpy==1.23.*",
    "matplotlib==3.7.*",
    "kivy",
    "kivy-garden.matplotlib",
    "plotly",
    "pandas==2.0.*",
]
pc = [
    # 2.20 is the first series with cp313 wheels, and requires-python allows
    # 3.13. Pinned to 2.19 the [pc] extra simply cannot be installed there.
    # 2.21 also has cp313 but regresses two tests, so 2.20 it is.
    "tensorflow==2.20.*",
    "tf-keras==2.20.*",
    # keras.py imports TensorBoard directly. 2.20 still pulls it in as a
    # transitive dep of tensorflow, but 2.21 unbundled it -- declare what we
    # actually import rather than rely on that continuing.
    "tensorboard==2.20.*",
    "matplotlib",
    "kivy",
    "kivy-garden.matplotlib",
    "pandas",
    "plotly",
    "albumentations",
]
macos = [
    "tensorflow==2.20.*",
    "tf-keras==2.20.*",
    "tensorboard==2.20.*",
    # tensorflow-metal stops at 1.2.0, which has no cp313 wheel. Rather than
    # cap the whole extra at 3.12, drop GPU acceleration on 3.13 and keep the
    # rest installable.
    "tensorflow-metal==1.2.0; python_version < '3.13'",
    "matplotlib",
    "kivy",
    "kivy-garden.matplotlib",
    "pandas",
    "plotly",
    "albumentations",
]
dev = [
    "pytest",
    "pytest-cov",
    "responses",
    "mypy",
    "ruff",
]
mcp = [
    "mcp>=2.1,<3",
]
torch = [
    "torch==2.11.*",
    "pytorch-lightning",
    "torchvision==0.26.*",
    "torchaudio==2.11.*",
    "fastai",
    "ipython",
]

[project.scripts]
donkey = "donkeycar.management.base:execute_from_command_line"

[project.urls]
Homepage = "https://github.com/autorope/donkeycar"

[tool.setuptools.dynamic]
version = {attr = "donkeycar.__version__"}

[tool.setuptools.packages.find]
namespaces = true

[tool.ruff]
target-version = "py312"
line-length = 120
# Without this, `exclude` is ignored for files named explicitly on the command
# line -- which is exactly how CI invokes ruff on the changed-file list.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"donkeycar/tests/*" = ["ANN"]
# Config templates are declarative constant files whose trailing comments
# document each tuning value. Reflowing them to a column limit would damage the
# reference they exist to be. Every other rule still applies to them.
"donkeycar/templates/cfg_*.py" = ["E501"]
"donkeycar/templates/myconfig.py" = ["E501"]
# 450 lines of untyped legacy that the MCP work only visits to fix a port leak.
# Annotating it is worth doing, but it is separate work and does not belong in
# an MCP commit. Every rule except the annotation ones still applies here.
"donkeycar/parts/web_controller/web.py" = ["ANN"]
# Likewise the management CLI: 78 of its 94 findings are ANN, and this work only
# visits it to register two commands and copy a file.
"donkeycar/management/base.py" = ["ANN"]

[tool.ruff.format]
# Config templates are hand-aligned reference documents: the trailing comment on
# each constant is the documentation. The formatter would rewrap those comments
# and parenthesise long values, which destroys what people read them for.
# Config templates are excluded because their hand-alignment IS the
# documentation. The two legacy modules are excluded for a different reason:
# this work only visits them (a port leak, two command registrations), and
# reformatting ~560 lines of unrelated code would bury those changes. Files this
# work actually rewrites are formatted normally. Formatting the legacy tree is
# worth doing, but as its own change.
exclude = [
    "donkeycar/templates/cfg_*.py",
    "donkeycar/templates/myconfig.py",
    "donkeycar/parts/web_controller/web.py",
    "donkeycar/management/base.py",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Report only on the files handed to mypy. Imported legacy modules are still
# read for type information but their own errors stay quiet -- the repo carries
# ~257 pre-existing errors that are not this work's to fix.
follow_imports = "silent"

# Strict on new modules ONLY. Listing them explicitly is what keeps the
# ~1,670 unannotated legacy functions out of the gate. Note that
# `strict = true` here would NOT scope -- mypy applies it globally without
# error -- so the individual flags are spelled out deliberately.
[[tool.mypy.overrides]]
module = [
    "donkeycar.parts.mcp_server",
    "donkeycar.parts.mcp_tools",
    "donkeycar.parts.track_config",
    "donkeycar.parts.cv_calibration",
    "donkeycar.management.mcp",
    "donkeycar.management.calibrate_cv",
    "donkeycar.mcp_agent.perception",
    "donkeycar.mcp_agent.policies",
    "donkeycar.mcp_agent.session",
    "donkeycar.mcp_agent.runner",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
# disallow_untyped_calls is deliberately NOT set. These modules necessarily call
# into donkeycar's untyped legacy code (utils, Vehicle, Memory), and enabling it
# would mean a type: ignore on nearly every such call. The flags that matter --
# our own code being fully and correctly typed -- are still on.
disallow_any_generics = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
warn_unused_ignores = true
extra_checks = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.ini", "*.txt", "*.kv"]
"donkeycar.templates" = ["*"]
"donkeycar.parts.web_controller.templates" = ["*"]
"donkeycar.management.tub_web" = ["*.html", "static/**/*"]
"scripts" = ["*"]
